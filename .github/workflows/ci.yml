name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the app
        run: docker compose up -d --build && sleep 5
      - name: Health check
        run: curl --fail localhost:5000/health
      - name: Clean up
        run: docker compose down
